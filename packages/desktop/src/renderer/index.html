<!doctype html>
<html data-theme="light" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Studio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4E5969" />
    <link rel="icon" type="image/png" href="./pwa/favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-180.png" />
    <title>Studio</title>
    <script>
      // Synchronously restore theme appearance from localStorage to prevent theme flash
      (function () {
        try {
          var theme = localStorage.getItem('__aionui_theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* Pre-JS boot splash — skeleton only (matches AppBootstrapSkeleton; no modal).
         Paints before the JS bundle loads so cold start is not a blank white page. */
      .html-boot-splash {
        --boot-bg: #ffffff;
        --boot-sider: #f7f8fa;
        --boot-block: #e5e6eb;
        --boot-border: #e5e6eb;
        box-sizing: border-box;
        display: flex;
        width: 100%;
        min-height: 100%;
        background: var(--boot-bg);
      }
      [data-theme='dark'] .html-boot-splash,
      body[arco-theme='dark'] .html-boot-splash {
        --boot-bg: #17171a;
        --boot-sider: #232324;
        --boot-block: #2e2e30;
        --boot-border: #3a3a3c;
      }
      .html-boot-splash *,
      .html-boot-splash *::before,
      .html-boot-splash *::after {
        box-sizing: border-box;
      }
      .html-boot-splash__sider {
        display: none;
        width: 260px;
        flex-shrink: 0;
        flex-direction: column;
        gap: 2px;
        padding: 12px;
        border-right: 1px solid var(--boot-border);
        background: var(--boot-sider);
      }
      @media (min-width: 768px) {
        .html-boot-splash__sider {
          display: flex;
        }
      }
      .html-boot-splash__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px;
        margin-bottom: 6px;
      }
      .html-boot-splash__block {
        background: var(--boot-block);
        border: 1px solid var(--boot-border);
        animation: html-boot-pulse 1.6s ease-in-out infinite;
      }
      .html-boot-splash__block--soft {
        border-radius: 8px;
      }
      .html-boot-splash__block--pill {
        border-radius: 999px;
      }
      .html-boot-splash__block--card {
        border-radius: 16px;
      }
      .html-boot-splash__nav {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px;
      }
      .html-boot-splash__divider {
        height: 1px;
        margin: 6px 0;
        background: var(--boot-border);
      }
      .html-boot-splash__main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
      }
      .html-boot-splash__pills {
        display: flex;
        gap: 10px;
      }
      .html-boot-splash__lines {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4px;
      }
      @keyframes html-boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.78;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Set arco-theme on body synchronously
      try {
        var t = localStorage.getItem('__aionui_theme');
        if (t) document.body.setAttribute('arco-theme', t);
      } catch (e) {}
    </script>
    <div id="root">
      <!-- Replaced by React createRoot.render once the bundle mounts. -->
      <div class="html-boot-splash" data-testid="html-boot-splash" aria-busy="true" aria-live="polite">
        <aside class="html-boot-splash__sider" aria-hidden="true">
          <div class="html-boot-splash__brand">
            <div class="html-boot-splash__block html-boot-splash__block--soft" style="width: 32px; height: 32px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 56px; height: 14px"></div>
          </div>
          <div class="html-boot-splash__nav">
            <div class="html-boot-splash__block html-boot-splash__block--soft" style="width: 16px; height: 16px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 72%; height: 12px"></div>
          </div>
          <div class="html-boot-splash__nav">
            <div class="html-boot-splash__block html-boot-splash__block--soft" style="width: 16px; height: 16px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 56%; height: 12px"></div>
          </div>
          <div class="html-boot-splash__nav">
            <div class="html-boot-splash__block html-boot-splash__block--soft" style="width: 16px; height: 16px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 68%; height: 12px"></div>
          </div>
          <div class="html-boot-splash__divider"></div>
          <div
            class="html-boot-splash__block html-boot-splash__block--pill"
            style="width: 40px; height: 10px; margin: 0 10px 2px"
          ></div>
          <div class="html-boot-splash__nav">
            <div class="html-boot-splash__block html-boot-splash__block--soft" style="width: 16px; height: 16px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 88%; height: 12px"></div>
          </div>
          <div class="html-boot-splash__nav">
            <div class="html-boot-splash__block html-boot-splash__block--soft" style="width: 16px; height: 16px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 76%; height: 12px"></div>
          </div>
          <div class="html-boot-splash__nav">
            <div class="html-boot-splash__block html-boot-splash__block--soft" style="width: 16px; height: 16px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 92%; height: 12px"></div>
          </div>
        </aside>
        <main class="html-boot-splash__main">
          <div
            class="html-boot-splash__block html-boot-splash__block--pill"
            style="width: 280px; max-width: 100%; height: 28px"
            aria-hidden="true"
          ></div>
          <div class="html-boot-splash__pills" aria-hidden="true">
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 96px; height: 32px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 112px; height: 32px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 104px; height: 32px"></div>
          </div>
          <div
            class="html-boot-splash__block html-boot-splash__block--card"
            style="width: 100%; max-width: 720px; height: 128px"
            aria-hidden="true"
          ></div>
          <div class="html-boot-splash__lines" aria-hidden="true">
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 120px; height: 12px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 92%; height: 12px"></div>
            <div class="html-boot-splash__block html-boot-splash__block--pill" style="width: 84%; height: 12px"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
